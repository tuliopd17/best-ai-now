# Atualiza os dados diariamente e faz commit — útil quando o site estiver
# publicado no GitHub Pages (Settings → Pages → branch main, pasta raiz).
name: Atualizar dados

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 09:00 UTC (06:00 em Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualizar dados do Artificial Analysis
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza dados do Artificial Analysis"
          git push
